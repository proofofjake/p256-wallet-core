[package]
name = "p256-wallet-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/proofofjake/p256-wallet-core"
description = "Signing core for P256 Wallet: Coinbase Smart Wallet v1 + ERC-4337 v0.6 operations signed by WebAuthn P-256 keys"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["uniffi-cli"]

[features]
default = []
# Swift bindings (UniFFI).
uniffi = ["dep:uniffi"]
uniffi-cli = ["uniffi", "uniffi/cli"]
# TypeScript bindings (wasm-bindgen).
wasm = ["dep:wasm-bindgen", "dep:serde", "dep:serde-wasm-bindgen"]

# Versions are pinned exactly; Cargo.lock pins the rest of the tree. See README "Dependencies".
[dependencies]
# Cryptography: RustCrypto, the mature 0.13 / 0.10 lines.
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
ecdsa = { version = "=0.16.9", default-features = false, features = ["der"] }
sha2 = { version = "=0.10.9", default-features = false }
sha3 = { version = "=0.10.8", default-features = false }
# 256-bit integers.
ruint = { version = "=1.17.2", default-features = false, features = ["alloc"] }

# Bindings only.
uniffi = { version = "=0.32.2", optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }
serde = { version = "=1.0.228", optional = true, features = ["derive"] }
serde-wasm-bindgen = { version = "=0.6.5", optional = true }

[dev-dependencies]
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
ureq = { version = "=3.1.2", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
